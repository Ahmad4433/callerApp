name: Build HB Caller APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor
        run: |
          set +e
          npx cap sync android > sync.log 2>&1
          code=$?
          cat sync.log
          if [ $code -ne 0 ]; then
            echo '### Sync Capacitor failed' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat sync.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - name: Build debug APK
        working-directory: android
        run: |
          set +e
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon > ../gradle.log 2>&1
          code=$?
          cat ../gradle.log
          if [ $code -ne 0 ]; then
            echo '### Build debug APK failed' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -c 60000 ../gradle.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hb-caller-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
