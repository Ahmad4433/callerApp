name: Build HB Caller APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Ensure a stable signing keystore exists
        working-directory: android/app
        run: |
          if [ ! -f debug-shared.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug-shared.keystore \
              -storepass hbcallershared \
              -alias hbcallerdebug \
              -keypass hbcallershared \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=HB Caller,OU=Dev,O=Hafiz Brothers,L=Lahore,S=Punjab,C=PK"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add debug-shared.keystore
            git commit -m "Add stable debug signing keystore (auto-generated by CI)"
            git push
          else
            echo "Keystore already exists — reusing it so updates install in place."
          fi

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor
        run: |
          set +e
          npx cap sync android > sync.log 2>&1
          code=$?
          cat sync.log
          if [ $code -ne 0 ]; then
            echo '### Sync Capacitor failed' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat sync.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - name: Build debug APK
        working-directory: android
        run: |
          set +e
          chmod +x gradlew
          ./gradlew assembleDebug -PbuildVersionCode=${{ github.run_number }} --no-daemon > ../gradle.log 2>&1
          code=$?
          cat ../gradle.log
          if [ $code -ne 0 ]; then
            echo '### Build debug APK failed' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -c 60000 ../gradle.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hb-caller-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Report build version
        run: echo "### Build versionCode ${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
